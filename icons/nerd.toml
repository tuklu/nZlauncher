# nZlauncher icon library: Nerd Fonts (v3)
# Lives at ~/.config/neZha/icons/nerd.toml. Copy it to <name>.toml and set
# icon_library = "<name>" under [settings] in catalog.toml to use your own.
# Anything a library leaves out falls back to this built-in set.
#
# [apps] keys are matched case-insensitively, in this order: desktop file id
# (org.mozilla.Thunderbird), its last dotted segment (thunderbird), the Icon=
# name, StartupWMClass, then the Exec binary name.
# [categories] keys are freedesktop categories from the desktop file.
# Glyphs: https://www.nerdfonts.com/cheat-sheet

