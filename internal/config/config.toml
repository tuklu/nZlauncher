# nZlauncher settings. Every line here is commented out and shows the
# default; uncomment and change what you want. Your actions live in
# catalog.toml next to this file.

# Face that `nzlauncher bar` opens: "tui" or "gtk".
# interface = "tui"

# GTK face only. "overlay" floats above everything, including fullscreen
# windows; "window" is a normal window your compositor's rules apply to.
# gtk_mode = "overlay"

# TUI app glyphs: icons/<name>.toml in this directory.
# icon_library = "nerd"

# What Backspace on an empty box (and other dead keys) sounds like:
# "off", "system" for the desktop's bell, or a sound file to play.
# error_sound = "off"

[wallpaper]
# Images the `wallpaper` prefix lists, and the command that sets one (the
# image path is appended).
# dir = "~/Pictures/Wallpapers"
# cmd = "swaybg -m fill -i"

[search]
# Web search fallback; %s is replaced by the query.
# url = "https://www.google.com/search?q=%s"

[files]
# What file search indexes. Exclude names a directory anywhere ("target") or
# a path below a root ("go/pkg"). Leaving exclude out keeps the built-in list
# of caches, dependency trees and build output.
# roots = ["~"]
# exclude = [".git", ".cache", "node_modules", "go/pkg", "target"]

[providers]
# Set any to false to turn it off everywhere: its prefix word, sentences
# that use it, and the first view.
# apps = true
# windows = true
# bluetooth = true
# wifi = true
# audio = true
# volume = true
# brightness = true
# monitor = true
# workspace = true
# wallpaper = true
# clipboard = true
# emoji = true
# files = true
# keys = true
# kill = true
# transcode = true
# plugins = true          # executables in providers.d/
# power = true            # power profiles
# dnd = true              # do not disturb
# nightlight = true
# awake = true            # keep the screen from locking and blanking
# units = true            # 5 km to miles, 72f in c
# currency = true         # 100 usd to inr; the daemon fetches ECB rates
#                         # from api.frankfurter.dev once a day, false stops it
# time = true             # time in tokyo, 3pm london to new york
# dates = true            # days until christmas, in 30 days, 2026-12-25

[fallbacks]
# What an unmatched query turns into.
# calc = true             # = 2+2
# url = true              # open example.com
# run = true              # run it as a command in a terminal
# search = true           # search the web

[backends]
# What drives each part of the system is detected from the running services;
# `nzlauncher setup` shows what was found. Name one here to override it.
# wifi = "iwd"                       # iwd, networkmanager
# compositor = "hyprland"
# power = "power-profiles-daemon"    # power-profiles-daemon, tuned
# notifications = "mako"           # mako, swaync, dunst
# nightlight = "hyprsunset"
# idle = "hypridle"                 # whatever serves org.freedesktop.ScreenSaver

[commands]
# What the built-in results run is picked from what is installed: neZha's
# scripts, then common tools (swayosd-client, wpctl, brightnessctl,
# xdg-terminal-exec...). `nzlauncher setup` lists each one and why. Set one
# here to use yours; {n} is a percent, {cmd} a command line, {target} a file
# or URL, {minutes} and {text} a reminder's.
# app = "uwsm-app -- {cmd}"
# open = "handlr open {target}"
# terminal = "foot -e {cmd}"
# volume = "pamixer --set-volume {n}"
# volume_up = "pamixer --increase {n}"
# volume_down = "pamixer --decrease {n}"
# mute = "pamixer --mute"
# unmute = "pamixer --unmute"
# brightness = "light -S {n}"
# brightness_up = "light -A {n}"
# brightness_down = "light -U {n}"
# remind = "my-reminder {minutes} {text}"
