# nZlauncher catalog, lives at ~/.config/nzlauncher/catalog.toml
# Your actions. Settings live in config.toml next to this file.
# An entry whose command is not installed is hidden: its first word, and
# whatever `requires` lists, have to be on PATH.

# ── Power ─────────────────────────────────────────────────────────────────────

[[action]]
id = "lock"
name = "Lock Screen"
icon = "󰌾"
group = "power"
# the idle daemon (hypridle, KDE, GNOME) runs its own lock command
cmd = "loginctl lock-session"

[[action]]
id = "suspend"
name = "Suspend"
icon = "󰒲"
group = "power"
cmd = "systemctl suspend"

[[action]]
id = "restart"
name = "Restart"
icon = "󰜉"
group = "power"
cmd = "systemctl reboot"

[[action]]
id = "shutdown"
name = "Shutdown"
icon = "󰐥"
group = "power"
cmd = "systemctl poweroff"

[[action]]
id = "logout"
name = "Logout"
icon = "󰍃"
group = "power"
cmd = "uwsm stop"

[[action]]
id = "screensaver"
name = "Start Screensaver"
icon = "󱄄"
group = "power"
cmd = "launch-screensaver"

# ── Toggles ───────────────────────────────────────────────────────────────────

[[action]]
id = "toggle-nightlight"
name = "Toggle Nightlight"
icon = "󰔎"
group = "toggle"
keywords = ["blue", "warm", "temperature"]
cmd = "toggle-nightlight"

[[action]]
id = "toggle-idle"
name = "Toggle Idle Lock"
icon = "󱫖"
group = "toggle"
keywords = ["caffeine", "awake"]
cmd = "toggle-idle"

[[action]]
id = "toggle-screensaver"
name = "Toggle Screensaver"
icon = "󱄄"
group = "toggle"
cmd = "toggle-screensaver"

[[action]]
id = "toggle-waybar"
name = "Toggle Top Bar"
icon = "󰍜"
group = "toggle"
keywords = ["waybar", "panel"]
cmd = "pkill -SIGUSR1 waybar"
requires = ["waybar"]

# ── Capture ───────────────────────────────────────────────────────────────────

[[action]]
id = "screenshot-smart"
name = "Screenshot"
icon = "󰆞"
group = "capture"
cmd = "screenshot"

[[action]]
id = "screenshot-window"
name = "Screenshot Window"
icon = "󰖯"
group = "capture"
cmd = "screenshot windows"

[[action]]
id = "screenshot-full"
name = "Screenshot Fullscreen"
icon = "󰹑"
group = "capture"
cmd = "screenshot fullscreen"

[[action]]
id = "ocr"
name = "Copy Text From Screen"
icon = "󰴑"
group = "capture"
keywords = ["ocr", "extract"]
cmd = "ocr"

[[action]]
id = "color-picker"
name = "Pick Color"
icon = "󰈊"
group = "capture"
keywords = ["hex", "eyedropper"]
cmd = "pkill hyprpicker || hyprpicker -a"
requires = ["hyprpicker"]

[[action]]
id = "record-screen"
name = "Record Screen"
icon = "󰻃"
group = "capture"
keywords = ["screenrecord", "video", "capture", "stop"]
cmd = "screenrecord"

[[action]]
id = "record-screen-audio"
name = "Record Screen With Audio"
icon = "󰻃"
group = "capture"
keywords = ["screenrecord", "video", "sound"]
cmd = "screenrecord --audio"

[[action]]
id = "record-screen-mic"
name = "Record Screen With Audio + Mic"
icon = "󰻃"
group = "capture"
keywords = ["screenrecord", "video", "voice"]
cmd = "screenrecord --audio --mic"

[[action]]
id = "set-reminder"
name = "Set Reminder"
icon = "󰒲"
group = "info"
keywords = ["timer", "remind", "alarm"]
cmd = "reminder prompt"

[[action]]
id = "show-reminders"
name = "Show Reminders"
icon = "󰒲"
group = "info"
keywords = ["timer", "remind"]
cmd = "reminder show"

[[action]]
id = "transcode"
name = "Transcode Media"
icon = "󰎁"
group = "capture"
keywords = ["convert", "ffmpeg", "compress", "video", "image"]
cmd = "nzlauncher bar \"transcode \""

[[action]]
id = "keybindings"
name = "Show Keybindings"
icon = "󰌌"
group = "info"
keywords = ["shortcuts", "keys", "hotkeys"]
cmd = "nzlauncher bar \"keys \""

# ── Info / audio ──────────────────────────────────────────────────────────────

[[action]]
id = "battery"
name = "Battery Status"
icon = "󰁹"
group = "info"
cmd = "notify-send -u low \"$(battery-status)\""
requires = ["battery-status"]

[[action]]
id = "weather"
name = "Weather"
icon = "󰖕"
group = "info"
cmd = "notify-send -u low \"$(weather)\""
requires = ["weather"]

[[action]]
id = "audio-output"
name = "Switch Audio Output"
icon = "󰓃"
group = "info"
keywords = ["speaker", "headphones", "sink"]
cmd = "audio-switch-output"

[[action]]
id = "mute-mic"
name = "Mute Microphone Toggle"
icon = "󰍭"
group = "toggle"
keywords = ["mic", "input"]
cmd = "audio-mute-input"

