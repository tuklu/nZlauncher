name: release

on:
  push:
    tags: ["v*"]
  # rebuild the files of an existing tag: gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # ubuntu LTS = older glibc than rolling distros, so the prebuilt
    # binary runs on a much wider range of systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gtk dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgirepository1.0-dev meson ninja-build libwayland-dev

      # not packaged on ubuntu 24.04 - tiny C lib, build from source
      - name: gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell
          cd gtk4-layer-shell
          meson setup build -Dintrospection=false -Dvapi=false -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: build
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w" -o nzlauncher-linux-amd64 ./cmd/nzlauncher
          go build -ldflags "-s -w" -o nzlauncher-gtk-linux-amd64 ./cmd/nzlauncher-gtk

      # nzlauncher-bin PKGBUILD with this version and real checksums, ready
      # to copy to the AUR. The files are listed in the order of its source=().
      - name: package files
        run: |
          sums=$(sha256sum nzlauncher-linux-amd64 nzlauncher-gtk-linux-amd64 LICENSE \
                 packaging/systemd/nzlauncher.service | cut -d' ' -f1 | tr '\n' ' ')
          awk -v v="${GITHUB_REF_NAME#v}" -v sums="$sums" '
            /^pkgver=/ { print "pkgver=" v; next }
            /^pkgrel=/ { print "pkgrel=1"; next }
            /^sha256sums=/ {
              n = split(sums, s, " ")
              for (i = 1; i <= n; i++) {
                line = (i == 1 ? "sha256sums=(" : "            ") "\047" s[i] "\047"
                print line (i == n ? ")" : "")
              }
              skip = 1; next
            }
            skip && /\)/ { skip = 0; next }
            skip { next }
            { print }' packaging/arch-bin/PKGBUILD > PKGBUILD
          sha256sum nzlauncher-linux-amd64 nzlauncher-gtk-linux-amd64 > SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="nzlauncher-linux-amd64 nzlauncher-gtk-linux-amd64 PKGBUILD SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pkgbuild
          path: PKGBUILD

  # nzlauncher-bin on the AUR follows each tagged release. A manual rebuild
  # of an old tag's files leaves the AUR alone.
  aur:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # makepkg writes .SRCINFO, and only Arch has makepkg
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkgbuild

      - name: tools
        run: pacman -Syu --noconfirm --needed git openssh

      # ssh in a container looks in the passwd home, not $HOME, so the key
      # and the pinned host keys are named explicitly
      - name: ssh
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
        run: |
          install -dm700 /tmp/aur-ssh
          printf '%s\n' "$AUR_KEY" > /tmp/aur-ssh/key
          printf '%s\n' "$AUR_KNOWN_HOSTS" > /tmp/aur-ssh/known_hosts
          chmod 600 /tmp/aur-ssh/key
          echo "GIT_SSH_COMMAND=ssh -i /tmp/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/aur-ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: push
        run: |
          git config --global --add safe.directory '*'
          git clone ssh://aur@aur.archlinux.org/nzlauncher-bin.git aur
          cp PKGBUILD aur/
          # makepkg will not run as root
          useradd -m builder
          chown -R builder aur
          (cd aur && su builder -c 'makepkg --printsrcinfo' > .SRCINFO)
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already has ${GITHUB_REF_NAME}"
            exit 0
          fi
          git -c user.name="Jisnu Kalita" -c user.email="ssh@tuklu.dev" commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

      - name: clean up the key
        if: always()
        run: rm -rf /tmp/aur-ssh
