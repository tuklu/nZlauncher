name: release

on:
  push:
    tags: ["v*"]
  # rebuild the files of an existing tag: gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # ubuntu LTS = older glibc than rolling distros, so the prebuilt
    # binary runs on a much wider range of systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gtk dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgirepository1.0-dev meson ninja-build libwayland-dev

      # not packaged on ubuntu 24.04 - tiny C lib, build from source
      - name: gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell
          cd gtk4-layer-shell
          meson setup build -Dintrospection=false -Dvapi=false -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: build
        run: go build -ldflags "-s -w" -o nzlauncher-linux-amd64 ./cmd/nzlauncher

      # nzlauncher-bin PKGBUILD with this version and real checksums, ready
      # to copy to the AUR
      - name: package files
        run: |
          v=${GITHUB_REF_NAME#v}
          bin_sum=$(sha256sum nzlauncher-linux-amd64 | cut -d' ' -f1)
          lic_sum=$(sha256sum LICENSE | cut -d' ' -f1)
          awk -v v="$v" -v b="$bin_sum" -v l="$lic_sum" '
            /^pkgver=/ { print "pkgver=" v; next }
            /^pkgrel=/ { print "pkgrel=1"; next }
            /^sha256sums=/ { print "sha256sums=('\''" b "'\''"; print "            '\''" l "'\'')"; skip=1; next }
            skip && /\)/ { skip=0; next }
            skip { next }
            { print }' packaging/arch-bin/PKGBUILD > PKGBUILD
          sha256sum nzlauncher-linux-amd64 > SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="nzlauncher-linux-amd64 PKGBUILD SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --generate-notes
          fi
