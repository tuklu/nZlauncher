name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gtk dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgirepository1.0-dev meson ninja-build libwayland-dev

      # not packaged on ubuntu 24.04 - tiny C lib, build from source
      - name: gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell
          cd gtk4-layer-shell
          meson setup build -Dintrospection=false -Dvapi=false -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # the D-Bus backends against fake services: NetworkManager, the
  # power-profiles API and BlueZ from python-dbusmock, on private buses
  dbusmock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: dbus and python-dbusmock
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus python3-dbus python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/mock"
          "$RUNNER_TEMP/mock/bin/pip" install python-dbusmock==0.38.1

      - name: test against the fakes
        run: '"$RUNNER_TEMP/mock/bin/python" test/dbusmock/run.py -v ./internal/wifi ./internal/tweaks ./internal/bluez'

  # the compositor adapter against a real sway, headless
  sway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: sway and foot
        run: |
          sudo apt-get update
          sudo apt-get install -y sway foot

      - name: test against sway
        run: test/sway/run.sh -v ./internal/compositor
